plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.4'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.fluidtokens.aquarium'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '21'
}

// The Dockerfile does `ADD ./build/libs/*.jar /app/app.jar`, and Docker refuses a multi-source ADD
// to a destination that is not a directory. Spring Boot's plugin otherwise emits TWO artifacts --
// the executable boot jar and a `-plain` library jar -- so `docker build` fails on a clean tree with
// "when using ADD with more than one source file, the destination must be a directory". Nothing here
// consumes the plain jar, so the honest fix is to stop producing it rather than to delete it in a
// build step somebody has to remember. See docker/README or the Dockerfile comment.
tasks.named('jar') {
	enabled = false
}

repositories {
	mavenCentral()
	mavenLocal()
}

dependencies {

	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	implementation 'org.cardanofoundation:cf-cardano-conversions-java:1.2.0'

	implementation 'com.bloxbean.cardano:yaci-store-spring-boot-starter:0.1.7'
	implementation 'com.bloxbean.cardano:yaci-store-utxo-spring-boot-starter:0.1.7'

	implementation('com.bloxbean.cardano:cardano-client-lib:0.7.2')
	implementation('com.bloxbean.cardano:cardano-client-backend-blockfrost:0.7.2')
	implementation('com.bloxbean.cardano:cardano-client-backend-ogmios:0.7.2')

	// Applies parameters to unapplied Aiken validators at runtime (multi-network parameterisation)
	implementation('com.bloxbean.cardano:aiken-java-binding:0.1.0')

	implementation 'io.micrometer:micrometer-registry-prometheus:1.13.4'

	implementation 'org.postgresql:postgresql:42.6.0'
	testImplementation 'com.h2database:h2:2.1.214'

	// Already on the runtime classpath via cardano-client-lib; declared here only so
	// OracleFeedSignatureTest can verify the oracle's ed25519 signatures at compile time.
	testImplementation 'org.bouncycastle:bcprov-jdk18on:1.78'

	compileOnly 'com.bloxbean.cardano:cardano-client-annotation-processor:0.7.2'
	annotationProcessor 'com.bloxbean.cardano:cardano-client-annotation-processor:0.7.2'

	// Lombok
	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testCompileOnly 'org.projectlombok:lombok:1.18.30'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

}

tasks.named('test') {
	useJUnitPlatform()
}
