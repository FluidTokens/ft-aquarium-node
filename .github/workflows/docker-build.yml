      # FAB-226-1 (PayInAdvanceAdaCollateralDryEvalTest: an ADA-collateral, USDM-principal pay-in-advance evaluates
      # offline through one rig oracle, the seized ADA comes back ADA-only, and a collateral oracle that does not
      # match the collateral is refused by name) re-measured cold keyless on feat/fab-211-213-214-seams, 2026-11-13:
      # 251 files / 2882 tests / 0 failures / 0 errors / 51 skipped, 0 orphans. Floor 251.
      # FAB-224-1 (ConvertAdaCollateralRigTest: an ADA→USDM convert evaluates offline paid from the collateral with
      # no wallet input, a small equity is topped up exactly to the ledger minimum, and one handed wallet utxo is the
      # only one spent) re-measured cold keyless on feat/fab-211-213-214-seams, 2026-11-13:
      # 252 files / 2895 tests / 0 failures / 0 errors / 51 skipped, 0 orphans. Floor 252.
      # FAB-224-2 (ConvertAdaCollateralRouterTest: the convert router builds an ADA collateral with no wallet input
      # when its liquidation fee pays for the order, the bot's outputs and the fee ceiling, otherwise with one wallet
      # utxo sized to the shortfall, and charges a small equity's min-ada top-up to ConvertEconomics) re-measured
      # cold keyless on feat/fab-211-213-214-seams, 2026-11-13:
      # 253 files / 2908 tests / 0 failures / 0 errors / 51 skipped, 0 orphans. Floor 253.
      # FAB-224-3 (ConvertAdaCollateralExecutorTest: the executor's convert floor charges the Minswap order ada the
      # bot fronts, an ADA-collateral convert paid from its collateral names no wallet output, and both gates are
      # pinned through real executor cycles) re-measured cold keyless on feat/fab-211-213-214-seams, 2026-11-13:
      # 254 files / 2919 tests / 0 failures / 0 errors / 51 skipped, 0 orphans. Floor 254.
      #
      # Left at 137 the gate would have tolerated losing a class in silence -- the exact defect this
      # step exists to catch. Re-measure before changing it; do not reconcile to a number written here.
      - name: Assert the suite did not quietly shrink
        env:
          RESULT_FILE_FLOOR: '254'
        run: |
          python3 - <<'PY'
          import glob, os, sys, xml.etree.ElementTree as ET

          floor = int(os.environ['RESULT_FILE_FLOOR'])
          files = sorted(glob.glob('build/test-results/test/*.xml'))
          problems = []

          if len(files) < floor:
              problems.append(
                  '%d result files, floor is %d: %d test class(es) stopped producing results. '
                  'A class that no longer runs cannot fail.' % (len(files), floor, floor - len(files)))

          for path in files:
              name = ET.parse(path).getroot().get('name')
              candidate = name.split('$')[0]
              while candidate and not os.path.exists('src/test/java/' + candidate.replace('.', '/') + '.java'):
                  candidate = candidate.rpartition('.')[0]
              if not candidate:
                  problems.append(
                      'orphan result file for `%s`: no such class under src/test/java, so it is a '
                      'stale artefact counted as if it had run.' % name)

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if problems and summary:
              with open(summary, 'a', encoding='utf-8') as handle:
                  handle.write('\n### Suite integrity check FAILED\n\n')
                  for problem in problems:
                      handle.write('- %s\n' % problem)

          for problem in problems:
              print(problem, file=sys.stderr)
          sys.exit(1 if problems else 0)
          PY

      # Step 4: Build the JAR file with Gradle
      - name: Build JAR file
        run: |
          ./gradlew bootJar  # Assuming you're using bootJar to build the JAR

      # Step 5: Compute the image tag
      #
      # ⛔ ONE TAG MUST MEAN EXACTLY ONE IMAGE, FOREVER. The old scheme was the build DATE alone, so
      # two merges on one day produced two different images under one tag and the second silently
      # overwrote the first. That happened for real: 2026.09.19 was published twice, and anyone who
      # pulled between the two got different bytes under a name they had pinned precisely to avoid
      # that. A tag an operator cannot trust is worse than no tag, because they pinned it deliberately.
      #
      # ⇒ `YYYY.MM.DD-<12-char commit sha>`. The date keeps the tags human-readable and sortable --
      # "which of these is newer" is the question operators actually ask -- and the sha makes a clash
      # STRUCTURALLY IMPOSSIBLE rather than merely detected.
      #
      # ⚠ TWELVE characters, not the customary seven, ON PURPOSE: `build.commitShort` in the jar is
      # `git rev-parse --short=12`, so the tag suffix is STRING-EQUAL to what /actuator/info reports.
      # An operator can compare the tag they deployed against the commit the running node claims with
      # their eyes, and the assertion below does the same thing at build time.
      #
      # ⚠ Not semver: nothing in this repo maintains a version (build.gradle is 0.0.1-SNAPSHOT), so a
      # semver would be a number someone increments rather than a fact about the artefact. Not a bare
      # sha either: unique, but it cannot be ordered, and ordering is what the date is for.
      - name: Compute the image tag
        id: version
        run: |
          SHA_SHORT="${GITHUB_SHA:0:12}"
          DATE="$(date +'%Y.%m.%d')"

          if [ "$GITHUB_REF_NAME" = "preview" ]; then
            VERSION="${DATE}-${SHA_SHORT}-pv"
          else
            VERSION="${DATE}-${SHA_SHORT}"
          fi

          # ⛔ THE TAG MUST NAME THE COMMIT THE IMAGE WAS ACTUALLY BUILT FROM. The jar carries its own
          # provenance, derived independently by build.gradle from git, so comparing the two turns the
          # sha in the tag from a label into a checked claim. Without this the tag is decoration: it
          # would still be unique, and could still be wrong.
          BUILD_INFO="build/resources/main/META-INF/build-info.properties"
          if [ ! -f "$BUILD_INFO" ]; then
            echo "::error::$BUILD_INFO is absent — the jar did not record its provenance, so the tag cannot be verified"
            exit 1
          fi
          JAR_COMMIT="$(grep '^build.commitShort=' "$BUILD_INFO" | cut -d= -f2)"
          if [ "$JAR_COMMIT" != "$SHA_SHORT" ]; then
            echo "::error::tag says ${SHA_SHORT} but the jar was built from ${JAR_COMMIT}"
            exit 1
          fi
          echo "tag ${VERSION} verified against the jar's own provenance (${JAR_COMMIT})"

          # ⚠ $GITHUB_OUTPUT, not ::set-output — the latter is deprecated and already warns on every run.
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      # Step 6: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}  # Docker Hub Username
          password: ${{ secrets.DOCKER_PASSWORD }}  # Docker Hub Personal Access Token

      # Step 7: Build and Push Docker image
      - name: Build and Push Docker image
        run: |
          VERSION=${{ steps.version.outputs.version }}  # Reference the output from Step 5
          DOCKER_IMAGE_NAME=fluidtokens/ft-aquarium-node
          echo "This is the image name: ${DOCKER_IMAGE_NAME}"
          DOCKER_IMAGE="${DOCKER_IMAGE_NAME}:${VERSION}"
          echo "Building Docker image with tag: ${DOCKER_IMAGE}"

          ## ⇒ TWO TAGS OF DIFFERENT KINDS, and the difference is the point:
          ##    ${VERSION}  IMMUTABLE. Carries the commit sha, is never reused, and is what an
          ##                operator pins. Any one of these will always be the same bytes.
          ##    latest      MOVING. A pointer to the newest build, and it changes under anyone who
          ##                tracks it. Fine for trying the node; wrong for running one.
          ## Don't push latest for preview or dev. ⛔ `latest` is what operators pull, so ONLY main
          ## may move it: any other ref (a workflow_dispatch on a feature branch included) used to fall
          ## through to `latest`, and now refuses instead of overwriting it.
          case "$GITHUB_REF_NAME" in
            main)    DOCKER_IMAGE_LATEST="${DOCKER_IMAGE_NAME}:latest" ;;
            preview) DOCKER_IMAGE_LATEST="${DOCKER_IMAGE_NAME}:latest-pv" ;;
            dev)     DOCKER_IMAGE_LATEST="${DOCKER_IMAGE_NAME}:latest-dev" ;;
            *) echo "refusing to publish from ref '$GITHUB_REF_NAME': only main, preview and dev have a moving tag" >&2; exit 1 ;;
          esac
          docker build -t "${DOCKER_IMAGE}" -t "${DOCKER_IMAGE_LATEST}" --push .

        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}  # Access secret from GitHub Secrets
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}  # Access secret from GitHub Secrets
